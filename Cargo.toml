[package]
name = "host_api"
version = "0.1.0"
edition = "2024"

[lib]
name = "host_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.22", features = ["invocation"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
libc = "0.2"

[package.metadata.android]
package = "com.habicode.hostapi"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "HabiCode Host API"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
launch_mode = "singleTask"

# Intent-filter agar aplikasi muncul di App Drawer sebagai ikon normal
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
