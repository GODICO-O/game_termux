name: Build Pure Rust APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-api.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK + platforms
        run: |
          SdkMgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SdkMgr" --licenses > /dev/null || true
          "$SdkMgr" --install "platforms;android-30" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Optimized Release APK with cargo-apk
        run: cargo apk build --release
        env:
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: habicode-pure-rust-apk
          path: "**/target/**/*.apk"
